# Salve em: .github/workflows/snake.yml (no repositório Acert99/Acert99)
# Gera a cobrinha nas cores da foto e publica na branch "output"

name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Acert99
          outputs: |
            dist/github-snake-dark.svg?color_snake=#b4ff39&color_dots=#1a1440,#2b1f6b,#4b3ab0,#6c5ce7,#b4ff39&color_background=#0d0b1e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
